{% load static %}{% comment %}
  Kirish oynasi: talaba va xodim HEMIS'ning turli manzillari orqali kiradi.
  Ochish: `$dispatch('open-login')`.
{% endcomment %}
<div x-data="{ open: false }" @open-login.window="open = true; $nextTick(() => $refs.choices.querySelector('a').focus())" @keydown.escape.window="open = false">
  <div x-show="open" x-cloak x-transition.opacity class="overlay" @click="open = false"></div>
  <div x-show="open" x-cloak class="modal pointer-events-none" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div x-show="open"
         x-transition:enter="transition duration-300 ease-[var(--ease-out-soft)]" x-transition:enter-start="translate-y-4 scale-95 opacity-0"
         x-transition:leave="transition duration-150 ease-in" x-transition:leave-end="translate-y-2 scale-95 opacity-0"
         class="modal-panel pointer-events-auto relative !max-w-md p-6 sm:p-8">
      <button type="button" class="btn btn-ghost btn-icon btn-sm absolute right-3 top-3" @click="open = false" aria-label="Yopish">
        {% include "ui/_icon.html" with name="close" class="size-4.5" %}
      </button>
      <img src="{% static 'img/xiu-logo-192.png' %}" alt="Xalqaro Innovatsion Universitet" width="80" height="80" class="mx-auto size-20">
      <h2 id="login-title" class="mt-3 text-center text-2xl">Kutubxonaga kirish</h2>
      <p class="mt-1.5 text-center text-sm text-[color:var(--color-content-muted)]">HEMIS hisobingiz bilan — alohida parol shart emas.</p>
      <div x-ref="choices" class="mt-6">{% include "oauth/_choices.html" %}</div>
    </div>
  </div>
</div>
