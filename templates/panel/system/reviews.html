{% extends "panel/base.html" %}
{% block title %}Sharhlar — Kutubxona paneli{% endblock %}

{% block panel_content %}
<div class="page-head">
  <div>
    <h1 class="page-title">Sharh moderatsiyasi</h1>
    <p class="page-sub">O'quvchi sharhi tasdiqlangandan keyingina kitob sahifasida ko'rinadi.</p>
  </div>
</div>

<form method="get" class="mb-4" role="search" hx-get="{% url 'panel:reviews' %}" hx-target="#review-list" hx-push-url="true"
      hx-trigger="submit, input changed delay:400ms from:#review-q, search from:#review-q" hx-include="#review-view">
  <label class="search max-w-md">
    <span class="text-[color:var(--color-content-subtle)]">{% include "ui/_icon.html" with name="search" class="size-4" %}</span>
    <input id="review-q" type="search" name="q" value="{{ q }}" placeholder="Kitob, muallif yoki matn..." autocomplete="off" aria-label="Qidiruv">
  </label>
</form>

<div id="review-list" hx-target="#review-list" hx-swap="innerHTML" aria-live="polite">
  {% include "panel/system/_reviews.html" %}
</div>
{% endblock %}
