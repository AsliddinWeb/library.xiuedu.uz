{% comment %}Mavzu tanlagich (tugma + menyu). `class` — qo'shimcha klass.{% endcomment %}
<div x-data="{ open: false }" class="relative {{ class }}">
  <button type="button" class="btn btn-ghost btn-icon{% if small %} btn-sm{% endif %}" aria-label="Mavzuni tanlash" data-tip="Mavzu"
          :aria-expanded="open" @click="open = !open">
    <span class="theme-sun">{% include "ui/_icon.html" with name="sun" class="size-5" %}</span>
    <span class="theme-moon">{% include "ui/_icon.html" with name="moon" class="size-5" %}</span>
  </button>
  <div x-show="open" x-cloak @click.outside="open = false" @keydown.escape.window="open = false" class="menu-panel !w-48">
    <button type="button" class="nav-item w-[calc(100%-0.75rem)] cursor-pointer" data-theme-set="light" @click="open = false">
      {% include "ui/_icon.html" with name="sun" class="size-4.5" %} Yorug'
      <span class="theme-check">{% include "ui/_icon.html" with name="check" class="size-4" %}</span>
    </button>
    <button type="button" class="nav-item w-[calc(100%-0.75rem)] cursor-pointer" data-theme-set="dark" @click="open = false">
      {% include "ui/_icon.html" with name="moon" class="size-4.5" %} Tungi
      <span class="theme-check">{% include "ui/_icon.html" with name="check" class="size-4" %}</span>
    </button>
    <button type="button" class="nav-item w-[calc(100%-0.75rem)] cursor-pointer" data-theme-set="system" @click="open = false">
      {% include "ui/_icon.html" with name="monitor" class="size-4.5" %} Tizimcha
      <span class="theme-check">{% include "ui/_icon.html" with name="check" class="size-4" %}</span>
    </button>
  </div>
</div>
