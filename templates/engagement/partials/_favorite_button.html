{% comment %}Sevimlilar tugmasi (HTMX bilan o'zini almashtiradi).{% endcomment %}
<button id="fav-btn" type="button"
        hx-post="{% url 'engagement:toggle_favorite' book.pk %}" hx-swap="outerHTML"
        class="btn {% if is_favorite %}btn-accent{% else %}btn-secondary{% endif %}"
        aria-pressed="{% if is_favorite %}true{% else %}false{% endif %}">
  <svg class="size-4" fill="{% if is_favorite %}currentColor{% else %}none{% endif %}"
       stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round"
          d="M19 14c1.5-1.5 3-3.4 3-5.5A4.5 4.5 0 0 0 12 5 4.5 4.5 0 0 0 2 8.5c0 2.1 1.5 4 3 5.5l7 7z"/>
  </svg>
  {% if is_favorite %}Sevimlilarda{% else %}Sevimlilarga{% endif %}
</button>
