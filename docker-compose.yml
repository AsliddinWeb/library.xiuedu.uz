# Lokal ishlab chiqish uchun PostgreSQL.
# Ko'tarish:  make db-up    (yoki: docker compose up -d)
# To'xtatish: make db-down
#
# Production'da bu fayl ishlatilmaydi — serverda tizim PostgreSQL'i bo'ladi (DEPLOY.md).
services:
  db:
    image: postgres:16-alpine
    container_name: xiu_library_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-library_db}
      POSTGRES_USER: ${DB_USER:-library_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library_pass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-library_user} -d ${DB_NAME:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
